[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-loan-risk-analytics"
version = "1.0.0"
description = "Portfolio risk analytics case study for a consumer-loan extract"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.0,<4.0",
  "numpy>=1.24,<3.0",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<1.0",
  "plotly>=5.0,<7.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0,<5.0", "nbconvert>=7.0,<8.0", "ipykernel>=6.0,<8.0"]

[tool.setuptools]
packages = ["src"]
